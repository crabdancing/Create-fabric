name: Build Mod (Imperial Style)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Optimization: Cache the enormous amount of Minecraft assets so
          # the second build doesn't take 5 minutes downloading sounds.
          cache-read-only: false

      - name: Build with Gradle
        # We explicitly pass -Dorg.gradle.java.home=$JAVA_HOME
        # $JAVA_HOME is set by the 'Setup Java 21' step.
        # This forces the Gradle Daemon to run on the correct JVM.
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.java.home=$JAVA_HOME -Dfabric.loom.ci=true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          # Adjust this path if Create outputs differently, usually it's here
          path: build/libs/*.jar 