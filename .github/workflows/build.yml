name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Is this a release build?
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v3

      # ------------------------------------------------------------------
      # THE FIX: Create the Init Script to remove broken FTB dependencies
      # ------------------------------------------------------------------
      - name: Inject Dependency Fixer
        run: |
          cat <<EOF > ./fix-deps.gradle
          allprojects {
              // Add the repo just in case
              repositories {
                  maven { url "https://maven.ftb.dev/public" }
                  maven { url "https://maven.parchmentmc.org" }
                  mavenCentral()
              }
              
              // Forcefully remove the missing FTB mods from the dependency list
              // BEFORE Gradle tries to resolve them.
              afterEvaluate { project ->
                  project.configurations.all { config ->
                      if (config.state == Configuration.State.UNRESOLVED) {
                          config.dependencies.removeIf { dep ->
                              if (dep.group == 'dev.ftb.mods') {
                                  println ":: NUKE :: Removing dependency: " + dep.group + ":" + dep.name
                                  return true
                              }
                              return false
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build
        # We add --init-script ./fix-deps.gradle to apply the fix
        run: ./gradlew build --init-script ./fix-deps.gradle

      # TODO: Enable when gametests work
      # - name: Run Gametests
      #   run: ./gradlew runGametestServer

      - name: Publish to Maven [Releases]
        if: ${{ github.event.inputs.release }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsReleasesRepository 
          --init-script ./fix-deps.gradle
          -PdevOsReleasesUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsReleasesPassword="${{ secrets.MAVEN_PASS }}"

      - name: Publish to Maven [Snapshots]
        if: ${{ !github.event.inputs.release }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsSnapshotsRepository 
          --init-script ./fix-deps.gradle
          -PdevOsSnapshotsUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsSnapshotsPassword="${{ secrets.MAVEN_PASS }}"

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/