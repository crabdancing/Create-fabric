name: Generate Verification Metadata

on: 
  workflow_dispatch:

jobs:
  generate-safe:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create Repo Fix & Exclusion Script
        # This script does two things:
        # 1. Adds the official FTB maven (just in case)
        # 2. FORCE EXCLUDES the missing FTB artifacts so Gradle stops panicking
        run: |
          cat <<EOF > ./fix-repos.gradle
          allprojects {
              repositories {
                  maven { url "https://maven.ftb.dev/public" }
                  maven { url "https://maven.parchmentmc.org" }
                  mavenCentral()
              }
              
              // The Nuclear Option:
              // Since the 2001.x versions of these mods are 404 Not Found on the internet,
              // we force Gradle to remove them from the dependency graph entirely.
              configurations.all {
                  exclude group: 'dev.ftb.mods', module: 'ftb-chunks-fabric'
                  exclude group: 'dev.ftb.mods', module: 'ftb-teams-fabric'
                  exclude group: 'dev.ftb.mods', module: 'ftb-library-fabric'
              }
          }
          EOF

      - name: Generate Metadata
        # We use the gradle wrapper included in the repo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --init-script ./fix-repos.gradle --write-verification-metadata sha256 help

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml