name: Generate Verification Metadata

on: 
  workflow_dispatch:

jobs:
  generate-safe:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create Repo Fix & Dependency Nuke Script
        # This script uses 'afterEvaluate' to modify the dependency list in memory.
        # It physically removes the broken FTB mods from the compile list 
        # before Gradle attempts to resolve the URL.
        run: |
          cat <<EOF > ./fix-repos.gradle
          allprojects {
              repositories {
                  maven { url "https://maven.ftb.dev/public" }
                  maven { url "https://maven.parchmentmc.org" }
                  mavenCentral()
              }
              
              afterEvaluate { project ->
                  println ":: SCANNING configurations for broken FTB dependencies in " + project.name
                  
                  project.configurations.all { config ->
                      // Check if the configuration can be modified
                      if (config.state == Configuration.State.UNRESOLVED) {
                          config.dependencies.removeIf { dep ->
                              if (dep.group == 'dev.ftb.mods') {
                                  println ":: NUKE :: Removing directly declared dependency: " + dep.group + ":" + dep.name
                                  return true
                              }
                              return false
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Metadata
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --init-script ./fix-repos.gradle --write-verification-metadata sha256 help

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml